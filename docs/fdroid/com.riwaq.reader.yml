# F-Droid recipe for Riwaq: the copy that goes to fdroiddata as
# metadata/com.riwaq.reader.yml (see README.md next to this file).
#
# Every build step mirrors the Android job in .github/workflows/release.yml,
# because F-Droid ships OUR signed APK only when its build of the same commit
# comes out byte-identical (Binaries + AllowedAPKSigningKeys below):
#
#   Rust 1.97.1       rust-toolchain.toml, and the workflows' pinned ref
#   NDK 26.1.10909125 release.yml's `sdkmanager "ndk;..."`
#   JDK 21            release.yml's setup-java, F-Droid's builder default
#   Node 20, pnpm 9   release.yml's setup-node / pnpm action
#   RUSTFLAGS         scripts/android-rustflags.sh, run by both
#
# scripts/verify-release-config.sh fails the release preflight if the NDK,
# the Rust version or the RUSTFLAGS script here stop matching release.yml,
# and .github/workflows/fdroid-verify.yml builds a commit with this recipe in
# F-Droid's own build image and compares the result with our release APK.
#
# The Builds entry is the latest release. fdroid-verify.yml rewrites its
# version and commit for a test build; fdroiddata's copy carries the real
# ones, and F-Droid's checkupdates adds later releases on its own from the
# tags (AutoUpdateMode below).

AntiFeatures:
  NonFreeNet:
    en-US: The optional Store browses third-party novel websites. Reading your own
      EPUB, PDF and DOCX files works fully offline.
Categories:
  - Ebook Reader
  - Reading
License: MIT
AuthorName: Mostafa Osama
SourceCode: https://github.com/TheMostafaOsamaDev/Riwaq-Reader
IssueTracker: https://github.com/TheMostafaOsamaDev/Riwaq-Reader/issues
Changelog: https://github.com/TheMostafaOsamaDev/Riwaq-Reader/releases

AutoName: Riwaq

RepoType: git
Repo: https://github.com/TheMostafaOsamaDev/Riwaq-Reader.git
Binaries: https://github.com/TheMostafaOsamaDev/Riwaq-Reader/releases/download/v%v/app-universal-release.apk

Builds:
  - versionName: 0.5.4
    versionCode: 5004
    commit: v0.5.4
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
      - npm install -g pnpm@9
    output: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    srclibs:
      - rustup@1.28.2
    prebuild:
      - sed -i '/^org\.gradle\.java\.home=/d' src-tauri/gen/android/gradle.properties
      - sed -i 's/signingConfigs.getByName("debug")/null/' src-tauri/gen/android/app/build.gradle.kts
    build:
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain 1.97.1
        --target aarch64-linux-android armv7-linux-androideabi
      - source $HOME/.cargo/env
      - export NDK_HOME=$$NDK$$
      - pnpm install --frozen-lockfile
      - gradle wrapper -p src-tauri/gen/android --gradle-version $(sed -n 's/.*gradle-\(.*\)-bin\.zip/\1/p'
        src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties)
      - RUSTFLAGS="$(bash scripts/android-rustflags.sh)" pnpm tauri android build
        --apk --target aarch64 armv7
    ndk: 26.1.10909125

AllowedAPKSigningKeys: 83cb81f108b4f2448b20a5f5f714ea22d4a0f6712035a6df9c4bf7f2d10291e2

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.5.4
CurrentVersionCode: 5004

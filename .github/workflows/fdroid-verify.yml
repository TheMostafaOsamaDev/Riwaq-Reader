# Would F-Droid ship our signed APK for this commit?
#
# F-Droid builds Riwaq from source with docs/fdroid/com.riwaq.reader.yml and
# ships the APK published on GitHub, signed with our key, only if its build
# comes out byte-identical. Otherwise that version is not published there.
# This workflow asks the question before a release goes to F-Droid rather
# than after: it builds the commit in F-Droid's own build image, the way
# fdroiddata's CI does (scripts/fdroid-verify-in-container.sh), and compares
# the result with the APK the Release workflow built from the same commit.
#
# It runs by itself after every Release run (a tag push, or a manual smoke
# run), against that run's APK. To check a run by hand:
#
#   gh workflow run fdroid-verify.yml -f release_run=<run id>
name: F-Droid verify

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run:
        description: Id of the Release run to compare against (default - the latest on this commit)
        required: false
  # TEMPORARY, for the first test before this workflow is on main: waits for
  # a Release run on the pushed commit. Removed before merge.
  push:
    branches: [build/fdroid-reproducible]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    # After a Release run, only when it built something to compare.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # F-Droid's build image is several GB, and the build needs room too.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Find the Release run to compare against
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN: ${{ github.event.workflow_run.id || inputs.release_run }}
        run: |
          # Files that go into the F-Droid build but not into the release APK.
          # A Release run of a commit differing only in these built the very
          # APK this commit would, so it is just as good to compare against,
          # and changing the checker does not cost a fresh 30-minute release.
          same_apk_inputs() {
            git diff --quiet "$1" HEAD -- . ':!docs' \
              ':!.github/workflows/fdroid-verify.yml' ':!scripts/fdroid-verify-in-container.sh'
          }
          id="$GIVEN"
          sha="$(git rev-parse HEAD)"
          for _ in $(seq 1 60); do
            [ -n "$id" ] && break
            runs="$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --limit 30 \
                    --json databaseId,headSha,status,conclusion)"
            # This commit's own run, finished or not.
            id="$(jq -r --arg s "$sha" '[.[] | select(.headSha == $s)][0].databaseId // empty' <<<"$runs")"
            if [ -z "$id" ]; then
              # Else the newest successful run on identical APK inputs.
              for cand in $(jq -r '.[] | select(.conclusion == "success") | "\(.databaseId):\(.headSha)"' <<<"$runs"); do
                git cat-file -e "${cand#*:}^{commit}" 2>/dev/null || continue
                if same_apk_inputs "${cand#*:}"; then id="${cand%%:*}"; break; fi
              done
            fi
            [ -n "$id" ] || sleep 30
          done
          test -n "$id" || { echo "::error::no Release run with this commit's APK inputs"; exit 1; }
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --exit-status >/dev/null
          run_sha="$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha)"
          git cat-file -e "$run_sha^{commit}" 2>/dev/null && same_apk_inputs "$run_sha" \
            || { echo "::error::Release run $id built $run_sha, whose APK inputs differ from this commit"; exit 1; }
          echo "Comparing against Release run $id ($run_sha)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Fetch the release APK to compare against
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh run download "${{ steps.run.outputs.id }}" -n android-apk -D out/artifact
          apk="$(find out/artifact -name '*.apk' | head -n1)"
          test -n "$apk"
          cp "$apk" out/release.apk

      - name: Build with F-Droid's builder and compare
        run: |
          docker run --rm \
            -v "$PWD:/src" -v "$PWD/out:/out" \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            bash /src/scripts/fdroid-verify-in-container.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fdroid-verify
          path: out/*
          if-no-files-found: ignore
